<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #ffffff; letter-spacing: 2px; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; font-weight: 500; }
    .panel-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
    .sub-title { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #64748b; font-weight: 600; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #cbd5e1; }
    .term-text { font-family: 'Courier New', Courier, monospace; font-size: 9px; fill: #a7f3d0; }
    .term-time { font-family: 'Courier New', Courier, monospace; font-size: 9px; fill: #64748b; }
    .nav-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #94a3b8; }
    .nav-text.active { fill: #00f0ff; }
  </style>

  <!-- Background -->
  <rect width="800" height="480" rx="15" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Header Title -->
  <text x="30" y="35" class="title">LOCAL-SMART UI LAYOUT SCHEMA</text>
  <text x="500" y="35" class="subtitle">三欄式科幻風格控制台佈局</text>

  <!-- Main UI Window Mockup -->
  <g transform="translate(30, 60)">
    <!-- Main Window Background -->
    <rect width="740" height="390" rx="8" fill="#020617" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect width="740" height="30" rx="8" fill="#0f172a" />
    <circle cx="15" cy="15" r="5" fill="#ef4444" />
    <circle cx="30" cy="15" r="5" fill="#f59e0b" />
    <circle cx="45" cy="15" r="5" fill="#10b981" />
    <text x="330" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" font-weight="700">Local-SMART Dashboard v1.0</text>

    <!-- ==================== LEFT SIDEBAR ==================== -->
    <g transform="translate(0, 30)">
      <!-- Sidebar Background -->
      <rect width="130" height="360" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      
      <!-- Brand Logo -->
      <g transform="translate(15, 20)">
        <polygon points="12,2 2,7 12,12 22,7" fill="#ffb700" opacity="0.8" />
        <path d="M2,12 L12,17 L22,12" stroke="#ffb700" stroke-width="1.5" fill="none" />
        <text x="30" y="11" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff">Local-SMART</text>
      </g>

      <!-- Navigation Items -->
      <!-- Item 1: Chat (Active) -->
      <g transform="translate(10, 60)">
        <rect width="110" height="28" rx="4" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
        <rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="#00f0ff" stroke-width="1.5" />
        <text x="28" y="17" class="nav-text active">Chat 對話區</text>
      </g>
      <!-- Item 2: Sessions -->
      <g transform="translate(10, 95)">
        <rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <text x="28" y="17" class="nav-text">Sessions 歷程</text>
      </g>
      <!-- Item 3: Profiles -->
      <g transform="translate(10, 130)">
        <rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <text x="28" y="17" class="nav-text">Profiles 代理人</text>
      </g>
      <!-- Item 4: Office -->
      <g transform="translate(10, 165)">
        <rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <text x="28" y="17" class="nav-text">Office 儀表板</text>
      </g>
      <!-- Item 5: Settings -->
      <g transform="translate(10, 200)">
        <rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <text x="28" y="17" class="nav-text">Settings 設定</text>
      </g>

      <!-- Sidebar Footer -->
      <text x="15" y="335" class="tech-text" fill="#475569">SYS OK • v1.0</text>
      <circle cx="105" cy="332" r="3" fill="#10b981" />
    </g>

    <!-- ==================== CENTER WORKSPACE ==================== -->
    <g transform="translate(130, 30)">
      <!-- Main Content Background -->
      <rect width="410" height="360" fill="#030712" />
      
      <!-- Panel Header -->
      <rect width="410" height="40" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="24" class="panel-title">Chat 對話區</text>
      <text x="110" y="24" class="sub-title">Active: DeepSeek-v4-pro</text>

      <!-- Messages Area -->
      <!-- Message 1 (User) -->
      <g transform="translate(20, 60)">
        <rect width="370" height="40" rx="6" fill="#1e293b" opacity="0.4" />
        <text x="12" y="16" class="label" font-weight="700" fill="#ffb700">USER</text>
        <text x="12" y="30" class="label">請幫我掃描專案並建立說明文件。</text>
      </g>

      <!-- Message 2 (Assistant) -->
      <g transform="translate(20, 115)">
        <rect width="370" height="85" rx="6" fill="rgba(0, 240, 255, 0.02)" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1" />
        <text x="12" y="18" class="label" font-weight="700" fill="#00f0ff">ASSISTANT (DeepSeek-v4-pro)</text>
        <text x="12" y="36" class="label">沒問題，我已經開始規劃了：</text>
        <text x="12" y="52" class="label">1. 建立 docs/ 資料夾</text>
        <text x="12" y="68" class="label">2. 生成架構與流程示意圖 (SVG)</text>
      </g>

      <!-- Bottom Chat Input Bar -->
      <g transform="translate(20, 310)">
        <rect width="370" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <text x="15" y="20" class="label" fill="#475569">輸入指令對話或執行任務...</text>
        <rect x="325" y="6" width="36" height="22" rx="4" fill="#ffb700" />
        <text x="333" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#000000">傳送</text>
      </g>
    </g>

    <!-- ==================== RIGHT DASHBOARD ==================== -->
    <g transform="translate(540, 30)">
      <!-- Panel Background -->
      <rect width="200" height="360" fill="#070a13" stroke="#1e293b" stroke-width="1" />
      
      <!-- Panel Header -->
      <rect width="200" height="40" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="15" y="24" class="panel-title">Office 監控中心</text>
      <rect x="135" y="12" width="50" height="16" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />
      <circle cx="143" cy="20" r="3" fill="#10b981" />
      <text x="150" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#10b981">Tail OK</text>

      <!-- Section 1: Conductor Card -->
      <g transform="translate(10, 50)">
        <rect width="180" height="100" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="18" class="sub-title">🏢 Conductor 指揮部</text>
        
        <!-- Brain Hologram (simplified) -->
        <g transform="translate(30, 55)" filter="url(#glowCyan)">
          <circle cx="0" cy="0" r="22" fill="none" stroke="#00f0ff" stroke-width="1" />
          <circle cx="0" cy="0" r="16" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="4 2" />
          <!-- Brain Node connections -->
          <polygon points="0,-12 10,-2 5,10 -5,10 -10,-2" fill="none" stroke="#00f0ff" stroke-width="1.2" />
          <circle cx="0" cy="0" r="3" fill="#00f0ff" />
        </g>
        
        <text x="72" y="52" class="panel-title" font-size="10">DeepSeek-v4-pro</text>
        <text x="72" y="68" class="tech-text" fill="#00f0ff">🧠 主大腦</text>
        <text x="72" y="82" class="tech-text" fill="#64748b">狀態: 執行工具中</text>
      </g>

      <!-- Section 2: Tool Monitor Circular Progress -->
      <g transform="translate(10, 160)">
        <rect width="180" height="70" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="18" class="sub-title">🛠️ 工具監控</text>
        
        <!-- Progress Ring -->
        <g transform="translate(35, 42)">
          <circle cx="0" cy="0" r="20" fill="none" stroke="#1e293b" stroke-width="4" />
          <path d="M0,-20 A20,20 0 1,1 -14,14" fill="none" stroke="#ffb700" stroke-width="4" stroke-linecap="round" filter="url(#glowGold)" />
          <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">80%</text>
        </g>
        
        <text x="72" y="38" class="panel-title" font-size="9" fill="#ffb700">工具: write_file</text>
        <text x="72" y="54" class="tech-text">正在寫入 overview.md</text>
      </g>

      <!-- Section 3: Live Terminal Logs -->
      <g transform="translate(10, 240)">
        <rect width="180" height="110" rx="6" fill="#05070f" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="16" class="sub-title">📋 即時日誌攔截</text>
        
        <!-- Terminal lines -->
        <g transform="translate(10, 28)">
          <text x="0" y="10" class="term-time">[14:08:58]</text>
          <text x="52" y="10" class="term-text">Call: write_to_file</text>
          
          <text x="0" y="24" class="term-time">[14:09:01]</text>
          <text x="52" y="24" class="term-text">File: architecture.svg OK</text>
          
          <text x="0" y="38" class="term-time">[14:09:05]</text>
          <text x="52" y="38" class="term-text">Agent task percentage: 80%</text>
          
          <text x="0" y="52" class="term-time">[14:09:07]</text>
          <text x="52" y="52" class="term-text">Pondering next tool...</text>

          <text x="0" y="66" class="term-time">[14:09:10]</text>
          <text x="52" y="66" class="term-text" fill="#39ff14">Ready for input.</text>
        </g>
      </g>
    </g>

  </g>
</svg>
